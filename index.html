<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老铁666</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1f2f 0%, #0b0f1a 100%);
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 48px 32px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7);
        }
        .emoji {
            font-size: 4rem;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            color: #f5d742;
            text-shadow: 0 0 60px rgba(245, 215, 66, 0.3);
            letter-spacing: 4px;
        }
        .sub {
            margin-top: 16px;
            color: #8892b0;
            font-size: 1rem;
            letter-spacing: 2px;
        }
        .badge {
            display: inline-block;
            margin-top: 24px;
            background: rgba(255, 215, 0, 0.12);
            color: #f5d742;
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 0.75rem;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">⚡</div>
        <h1>老铁666</h1>
        <div class="sub">NFC 扫描成功 🎉</div>
        <div class="badge">❤️ 感谢支持</div>
    </div>
</body>
</html>
